services:
  - type: web
    name: zeronet-upi-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: PORT
        value: 8080
      - key: NODE_ENV
        value: production
      - key: IDEMPOTENCY_TTL_SECONDS
        value: 86400
      - key: PACKET_MAX_AGE_SECONDS
        value: 86400
